plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaquero.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.vaquero.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Leídos via -P en la línea de Gradle (CI) o keystore.properties (local)
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) { props.load(new FileInputStream(propsFile)) }

            storeFile     file(props.getProperty("storeFile",     "keystore/release.jks"))
            storePassword props.getProperty("storePassword", "")
            keyAlias      props.getProperty("keyAlias",      "killbill")
            keyPassword   props.getProperty("keyPassword",   "")
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}