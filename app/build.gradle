plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaquero.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.vaquero.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "keystore/release.jks")
            storePassword (System.getenv("STORE_PASSWORD") ?: "").trim()
            keyAlias      (System.getenv("KEY_ALIAS")      ?: "killbill").trim()
            keyPassword   (System.getenv("KEY_PASSWORD")   ?: "").trim()
        }
    }

    buildTypes {
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}