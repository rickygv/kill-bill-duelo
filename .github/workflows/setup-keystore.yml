name: 🔑 Setup — Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      cn:
        description: 'Tu nombre o nombre de la app'
        required: true
        default: 'Kill Bill Duelo'
      org:
        description: 'Organización o empresa'
        required: true
        default: 'Vaquero Games'
      country:
        description: 'Código de país (2 letras)'
        required: true
        default: 'MX'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -v \
            -keystore keystore/release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=${{ inputs.cn }}, O=${{ inputs.org }}, C=${{ inputs.country }}"
          echo "✅ Keystore generado"
          ls -lh keystore/

      - name: Export as Base64
        run: |
          base64 -w 0 keystore/release.jks > keystore/release.jks.b64
          echo ""
          echo "══════════════════════════════════════════"
          echo "KEYSTORE_BASE64 (copia este valor al secret):"
          echo "══════════════════════════════════════════"
          cat keystore/release.jks.b64
          echo ""
          echo "══════════════════════════════════════════"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: keystore/release.jks.b64
          retention-days: 1