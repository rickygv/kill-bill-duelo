name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permite ejecutar manualmente desde GitHub

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del cÃ³digo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 (requerido por AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Android SDK (ya viene en ubuntu-latest, solo configuramos)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache de Gradle para builds mÃ¡s rÃ¡pidos
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Permisos al wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Descargar el gradle-wrapper.jar real
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      # 7. Compilar APK debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # 8. Subir APK como artifact descargable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kill-bill-duelo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 9. Mostrar info del APK
      - name: APK info
        run: |
          echo "âœ… APK generado:"
          ls -lh app/build/outputs/apk/debug/
