name: Build Release APK (Play Store)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Generate Keystore & keystore.properties
        env:
          RAW_STORE: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY:   ${{ secrets.KEY_PASSWORD }}
          RAW_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SP=$(printf '%s' "$RAW_STORE" | tr -d '[:space:]')
          KP=$(printf '%s' "$RAW_KEY"   | tr -d '[:space:]')
          KA=$(printf '%s' "$RAW_ALIAS" | tr -d '[:space:]')

          mkdir -p keystore
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
            -alias "$KA" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$SP" \
            -keypass "$SP" \
            -dname "CN=Kill Bill Duelo, O=Vaquero Games, C=MX" \
            -noprompt
          echo "✅ Keystore: $(wc -c < $GITHUB_WORKSPACE/keystore/release.jks) bytes"

          # Escribir keystore.properties con ruta ABSOLUTA (evita ambigüedad relativa)
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/keystore/release.jks" "$SP" "$KA" "$SP" \
            > "$GITHUB_WORKSPACE/keystore.properties"

          echo "✅ keystore.properties:"
          cat "$GITHUB_WORKSPACE/keystore.properties" | sed 's/Password=.*/Password=***/'

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "📦 $(ls -lh $APK | awk '{print $5}')"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose $APK 2>&1 | head -4

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kill-bill-duelo-RELEASE-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: "Kill Bill Duelo ${{ github.ref_name }}"