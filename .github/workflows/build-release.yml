name: Build Release APK (Play Store)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Generate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p keystore
          keytool -genkeypair \
            -keystore keystore/release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kill Bill Duelo, O=Vaquero Games, C=MX" \
            -noprompt
          echo "✅ Keystore: $(wc -c < keystore/release.jks) bytes"
          keytool -list -keystore keystore/release.jks \
            -storepass "$STORE_PASSWORD" -noprompt 2>&1 | head -4

      - name: Build Release APK
        env:
          KEYSTORE_PATH:  ${{ github.workspace }}/keystore/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "📦 APK size: $(ls -lh $APK | awk '{print $5}')"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose $APK 2>&1 | head -3

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kill-bill-duelo-RELEASE-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: "Kill Bill Duelo ${{ github.ref_name }}"
          body: |
            ## ⚔️ Kill Bill Duelo ${{ github.ref_name }}
            APK firmado y listo para Play Store.